<!DOCTYPE html>
<html class="dark" lang="sk">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CDZ Integra Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#135bec", "surface": "#1e2532", "bg-dark": "#101622" } } } }
    </script>
</head>
<body class="bg-bg-dark text-white font-['Plus_Jakarta_Sans'] min-h-screen pb-20 p-6 text-xs text-slate-300">
    <div class="max-w-md mx-auto">
        <header class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-extrabold text-blue-500">INTEGRA MULTIMEDIA</h1>
                <p class="text-slate-400">Správa TV a obsahu</p>
            </div>
            <button onclick="posliMedia('text')" class="bg-slate-700 px-3 py-2 rounded-lg font-bold uppercase text-[10px] text-white">Reset TV</button>
        </header>

        <section class="mb-6">
            <h2 class="font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Multimédiá a Vzhľad</h2>
            <div class="bg-surface p-4 rounded-2xl border border-white/5 space-y-4 shadow-2xl">
                <div class="flex items-center justify-between bg-black/20 p-3 rounded-xl">
                    <label class="font-bold uppercase text-[10px]">Farba pozadia TV:</label>
                    <input type="color" oninput="posli('farba_pozadia', this.value)" class="w-12 h-8 bg-transparent border-none cursor-pointer">
                </div>
                <div>
                    <label class="block mb-1 text-slate-400">Obrázok (URL):</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-foto" placeholder="https://..." class="bg-black/20 border-none rounded-xl w-full p-2 text-white">
                        <button onclick="posliMedia('foto')" class="bg-primary px-3 rounded-xl font-bold text-white">Zobraziť</button>
                    </div>
                </div>
                <div>
                    <label class="block mb-1 text-slate-400">YouTube ID:</label>
                    <div class="flex gap-2">
                        <input type="text" id="input-video" placeholder="napr. dQw4w9WgXcQ" class="bg-black/20 border-none rounded-xl w-full p-2 text-white">
                        <button onclick="posliMedia('video')" class="bg-red-600 px-3 rounded-xl font-bold text-white text-[10px]">Hrať Video</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="mb-6">
            <h2 class="font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Menu a Oznamy</h2>
            <div class="bg-surface p-4 rounded-2xl border border-white/5 space-y-3 shadow-xl">
                <input type="text" oninput="posli('polievka', this.value)" placeholder="Dnešná polievka" class="bg-black/20 border-none rounded-xl w-full p-3 text-white font-bold">
                <input type="text" oninput="posli('hlavne_jedlo', this.value)" placeholder="Hlavné jedlo" class="bg-black/20 border-none rounded-xl w-full p-3 text-white font-bold">
                <textarea oninput="posli('program', this.value)" rows="2" placeholder="Bežiaci oznam..." class="bg-black/20 border-none rounded-xl w-full p-3 text-white"></textarea>
            </div>
        </section>

        <section class="mb-6">
            <h2 class="font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1 text-slate-500">Týždenný plán</h2>
            <div class="bg-surface p-4 rounded-2xl border border-white/5 space-y-2 shadow-xl">
                <div class="flex items-center gap-2"><span class="w-6 text-primary font-black">PO</span><input type="text" oninput="posliTyzden('po', this.value)" class="bg-black/20 border-none rounded-lg w-full p-2 text-white" placeholder="..."></div>
                <div class="flex items-center gap-2"><span class="w-6 text-primary font-black">UT</span><input type="text" oninput="posliTyzden('ut', this.value)" class="bg-black/20 border-none rounded-lg w-full p-2 text-white" placeholder="..."></div>
                <div class="flex items-center gap-2"><span class="w-6 text-primary font-black">ST</span><input type="text" oninput="posliTyzden('st', this.value)" class="bg-black/20 border-none rounded-lg w-full p-2 text-white" placeholder="..."></div>
                <div class="flex items-center gap-2"><span class="w-6 text-primary font-black">ŠT</span><input type="text" oninput="posliTyzden('št', this.value)" class="bg-black/20 border-none rounded-lg w-full p-2 text-white" placeholder="..."></div>
                <div class="flex items-center gap-2"><span class="w-6 text-primary font-black">PI</span><input type="text" oninput="posliTyzden('pi', this.value)" class="bg-black/20 border-none rounded-lg w-full p-2 text-white" placeholder="..."></div>
            </div>
        </section>
    </div>

    <script>
        const dbUrl = "https://cdz-integra-default-rtdb.firebaseio.com/jedalnicek.json";
        
        function posli(k, h) {
            fetch(dbUrl).then(r => r.json()).then(d => {
                let n = d || {}; n[k] = h;
                fetch(dbUrl, { method: 'PUT', body: JSON.stringify(n) });
            });
        }

        function posliTyzden(den, h) {
            fetch(dbUrl).then(r => r.json()).then(d => {
                let n = d || {}; if(!n.tyzden) n.tyzden = {}; n.tyzden[den] = h;
                fetch(dbUrl, { method: 'PUT', body: JSON.stringify(n) });
            });
        }

        function posliMedia(typ) {
            fetch(dbUrl).then(r => r.json()).then(d => {
                let n = d || {}; n.rezim = typ;
                if(typ === 'foto') n.url_foto = document.getElementById('input-foto').value;
                if(typ === 'video') n.url_video = document.getElementById('input-video').value;
                fetch(dbUrl, { method: 'PUT', body: JSON.stringify(n) });
            });
        }
    </script>
</body>
</html>
