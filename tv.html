<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Panel - Integra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100vh; margin: 0; transition: background-color 1s ease; }
        .glass { background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2.5rem; }
        .logo-text { color: white; text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); letter-spacing: -3px; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 30s linear infinite; }
        .fade-in { animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="p-12">
    <header id="tv-header" class="flex justify-between items-center mb-10">
        <div class="leading-tight">
            <span class="text-7xl font-black logo-text">INTEGRA</span>
            <p id="meniny-dnes" class="text-white/80 text-xl font-bold mt-1 italic">Načítavam...</p>
        </div>
        <div class="text-right leading-none">
            <div id="hodiny" class="text-7xl font-black">00:00</div>
            <div id="datum" class="text-xl text-white/60 uppercase font-bold mt-2">...</div>
        </div>
    </header>

    <main id="text-rezim">
        <div id="sekcia-menu" class="grid grid-cols-2 gap-10 fade-in">
            <div class="glass p-10 relative border-l-[12px] border-orange-500 shadow-2xl">
                <span class="text-orange-500 font-black uppercase text-xl">Dnešná polievka</span>
                <p id="tv-polievka" class="text-6xl font-extrabold mt-8 leading-tight">---</p>
            </div>
            <div class="glass p-10 relative border-l-[12px] border-emerald-500 shadow-2xl">
                <span class="text-emerald-500 font-black uppercase text-xl">Hlavný chod</span>
                <p id="tv-hlavne" class="text-6xl font-extrabold mt-8 leading-tight">---</p>
            </div>
        </div>

        <div id="sekcia-tyzden" class="hidden glass p-10 border-l-[12px] border-white/50 fade-in shadow-2xl">
            <h2 class="text-3xl font-black mb-8 text-white uppercase tracking-widest">Týždenný plán aktivít</h2>
            <div class="grid grid-cols-5 gap-4 text-center">
                <div class="bg-black/20 p-4 rounded-3xl"><span class="text-white/60 font-black block border-b border-white/10 mb-2">PO</span><p id="t-po" class="text-xl">---</p></div>
                <div class="bg-black/20 p-4 rounded-3xl"><span class="text-white/60 font-black block border-b border-white/10 mb-2">UT</span><p id="t-ut" class="text-xl">---</p></div>
                <div class="bg-black/20 p-4 rounded-3xl"><span class="text-white/60 font-black block border-b border-white/10 mb-2">ST</span><p id="t-st" class="text-xl">---</p></div>
                <div class="bg-black/20 p-4 rounded-3xl"><span class="text-white/60 font-black block border-b border-white/10 mb-2">ŠT</span><p id="t-št" class="text-xl">---</p></div>
                <div class="bg-black/20 p-4 rounded-3xl"><span class="text-white/60 font-black block border-b border-white/10 mb-2">PI</span><p id="t-pi" class="text-xl">---</p></div>
            </div>
        </div>
    </main>

    <div id="foto-rezim" class="hidden fixed inset-0 z-[100] bg-black p-6"><img id="full-foto" src="" class="h-full w-full object-contain rounded-3xl shadow-2xl"></div>
    <div id="video-rezim" class="hidden fixed inset-0 z-[110] bg-black"><iframe id="yt-player" class="w-full h-full" src="" frameborder="0" allow="autoplay; encrypted-media"></iframe></div>

    <footer id="tv-footer" class="fixed bottom-0 left-0 w-full bg-black/40 backdrop-blur-md py-6 overflow-hidden border-t border-white/10">
        <div class="whitespace-nowrap"><span id="tv-program" class="animate-marquee text-4xl font-black uppercase tracking-wider">...</span></div>
    </footer>

    <script>
        const dbUrl = "https://cdz-integra-default-rtdb.firebaseio.com/jedalnicek.json";
        let mode = 0;

        function refresh() {
            fetch(dbUrl).then(r => r.json()).then(d => {
                if(!d) return;
                
                // Aktualizácia farby pozadia
                if(d.farba_pozadia) document.body.style.backgroundColor = d.farba_pozadia;

                const tr = document.getElementById('text-rezim');
                const fr = document.getElementById('foto-rezim');
                const vr = document.getElementById('video-rezim');
                const yt = document.getElementById('yt-player');
                const hdr = document.getElementById('tv-header');
                const ftr = document.getElementById('tv-footer');

                if(d.rezim === 'foto') {
                    tr.classList.add('hidden'); vr.classList.add('hidden'); fr.classList.remove('hidden');
                    hdr.classList.add('hidden'); ftr.classList.add('hidden');
                    document.getElementById('full-foto').src = d.url_foto;
                    yt.src = "";
                } 
                else if(d.rezim === 'video') {
                    tr.classList.add('hidden'); fr.classList.add('hidden'); vr.classList.remove('hidden');
                    hdr.classList.add('hidden'); ftr.classList.add('hidden');
                    const vUrl = "https://www.youtube.com/embed/" + d.url_video + "?autoplay=1&mute=0&rel=0";
                    if(yt.src !== vUrl) yt.src = vUrl;
                }
                else {
                    fr.classList.add('hidden'); vr.classList.add('hidden'); tr.classList.remove('hidden');
                    hdr.classList.remove('hidden'); ftr.classList.remove('hidden');
                    yt.src = "";
                    document.getElementById('tv-polievka').innerText = d.polievka || "---";
                    document.getElementById('tv-hlavne').innerText = d.hlavne_jedlo || "---";
                    if(d.tyzden) {
                        document.getElementById('t-po').innerText = d.tyzden.po || "---";
                        document.getElementById('t-ut').innerText = d.tyzden.ut || "---";
                        document.getElementById('t-st').innerText = d.tyzden.st || "---";
                        document.getElementById('t-št').innerText = d.tyzden.št || "---";
                        document.getElementById('t-pi').innerText = d.tyzden.pi || "---";
                    }
                }
                if(d.program) document.getElementById('tv-program').innerText = " • " + d.program + " • " + d.program;
            });
        }

        setInterval(() => {
            if(!document.getElementById('text-rezim').classList.contains('hidden')) {
                const m = document.getElementById('sekcia-menu');
                const t = document.getElementById('sekcia-tyzden');
                mode = mode === 0 ? 1 : 0;
                m.classList.toggle('hidden', mode === 1);
                t.classList.toggle('hidden', mode === 0);
            }
        }, 15000);

        function clock() {
            const n = new Date();
            document.getElementById('hodiny').innerText = n.toLocaleTimeString('sk-SK', {hour:'2-digit', minute:'2-digit'});
            document.getElementById('datum').innerText = n.toLocaleDateString('sk-SK', {weekday:'long', day:'numeric', month:'long'});
        }
        
        fetch('https://meniny.vyskusa.sk/api/ok/sk').then(r => r.json()).then(d => document.getElementById('meniny-dnes').innerText = "Dnes má meniny: " + d.meniny.sk);
        setInterval(refresh, 3000); setInterval(clock, 1000); refresh(); clock();
    </script>
</body>
</html>
